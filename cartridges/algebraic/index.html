<style>

body{background:
  radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 12%,#fff 50%,transparent 51%),

  radial-gradient(1.5px 1.5px at 91% 55%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 44% 36%,#ddf 50%,transparent 51%),
  radial-gradient(900px 600px at 80% -10%,#3a1a7a 0%,transparent 60%),radial-gradient(800px 600px at 0% 110%,#0f3a5a 0%,transparent 60%),var(--bg);

.center{align-items:center;justify-content:center;text-align:center}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.4)}

i.v,.msg i,.m i,.disp i,.steps i,.opt i,.beam i{font-style:italic;font-family:var(--math);color:var(--yellow)}

.chip.now{color:var(--yellow);border-color:var(--yellow);background:rgba(255,210,74,.08)} .chip.now .dot{background:var(--yellow);color:#2a1d00}
.brief{max-width:900px;margin:0 auto;padding:22px 26px;width:100%}
.kicker{color:var(--yellow);font-weight:800;letter-spacing:.14em;font-size:.8rem}

/* ---------- Modal ---------- */

.mbox h3{margin:.1rem 0 .4rem;font-size:1.85rem}
.mbox h3.good{color:var(--green)} .mbox h3.bad{color:var(--red)} .mbox h3.gold{color:var(--yellow)}
.mbox .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ptsline{font-size:1.25rem;font-weight:900;color:var(--green)}
.map{background:#0f0929;border:1px solid var(--line);border-radius:14px;padding:.7rem 1rem;margin:.5rem 0;text-align:center}
.map .ph{font-size:1.3rem;line-height:1.6}
.map .ar{color:var(--muted);font-size:1.2rem}

/* ---------- Report ---------- */
.report{max-width:860px;margin:0 auto;padding:24px 28px;width:100%}
.rank{font-size:2.2rem;font-weight:900;color:var(--green);margin:.1rem 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:1rem 0}
.big{background:#0f0929;border:1px solid var(--line);border-radius:14px;padding:.7rem;text-align:center}

.vrow:last-child{border:0}

.review{margin-top:1rem;background:rgba(255,210,74,.07);border:1px solid rgba(255,210,74,.4);border-radius:14px;padding:.7rem 1rem;line-height:1.5}

#flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(circle,transparent 35%,rgba(255,84,112,.5));opacity:0}

@media (max-width:1050px){.console,.console.wide{grid-template-columns:1fr 1fr}.comms{grid-column:1 / -1;min-height:0}.kw{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.console,.console.wide{grid-template-columns:1fr}.how{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.view{grid-template-columns:90px 1fr}.alien{width:84px}.opts{grid-template-columns:1fr}.msg{font-size:1.35rem}}
</style>

<body>
<div id="app"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="modal" class="modal hidden"><div class="mbox card" id="mbox"></div></div>

<script>
'use strict';
/* =====================================================================
   GALACTIC TRANSLATOR · enVision 2.0 Grade 6 · Lesson 3-4
   Write Algebraic Expressions (+ parts of an expression)
   ===================================================================== */

/* ---------------- Exact rational numbers ---------------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
class Q{
  constructor(n,d=1){ if(d===0) throw new Error('divide by zero'); if(d<0){n=-n;d=-d;} const g=gcd(n,d); this.n=n/g; this.d=d/g; }
  add(o){return new Q(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){return new Q(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Q(this.n*o.n,this.d*o.d);}
  div(o){return new Q(this.n*o.d,this.d*o.n);}
  eq(o){return this.n===o.n&&this.d===o.d;}
}
const q=(n,d=1)=>new Q(n,d);
const dq=s=>{s=String(s);const [i,f='']=s.split('.');return new Q(parseInt((i||'0')+f,10),Math.pow(10,f.length));};
function qText(x){
  if(x.n<0)return '−'+qText(new Q(-x.n,x.d));
  if(x.d===1)return String(x.n);
  const w=Math.floor(x.n/x.d),r=x.n-w*x.d;return w>0?`${w} ${r}/${x.d}`:`${r}/${x.d}`;
}
function qHTML(x){
  if(x.n<0)return '−'+qHTML(new Q(-x.n,x.d));
  if(x.d===1)return String(x.n);
  const w=Math.floor(x.n/x.d),r=x.n-w*x.d;const fr=`<span class="fr"><span>${r}</span><span>${x.d}</span></span>`;return w>0?`${w}${fr}`:fr;
}

/* ---------------- Expression trees ---------------- */
const N=v=>({t:'num',v:(v instanceof Q)?v:q(v)});
const V=name=>({t:'var',name});
const G=x=>({t:'grp',x});
const wrapN=x=>(typeof x==='number'||x instanceof Q)?N(x):x;
const B=(op,a,b,imp=false)=>({t:'bin',op,a:wrapN(a),b:wrapN(b),imp});
const add=(a,b)=>B('+',a,b),sub=(a,b)=>B('-',a,b),imul=(a,b)=>B('*',a,b,true),dvd=(a,b)=>B('/',a,b);
const K=(node,id)=>{node.cid=id;return node;};   // tag a node with a color id (links words to algebra)
function apply(op,a,b){switch(op){case '+':return a.add(b);case '-':return a.sub(b);case '*':return a.mul(b);case '/':return a.div(b);}}
function evq(n,x){switch(n.t){case 'num':return n.v;case 'var':return x;case 'grp':return evq(n.x,x);case 'bin':return apply(n.op,evq(n.a,x),evq(n.b,x));}}
function equiv(a,b){
  let ok=0;
  for(const x of [2,3,5,7,11,13]){
    let va,vb;try{va=evq(a,q(x));vb=evq(b,q(x));}catch(e){continue;}
    if(!va.eq(vb))return false;ok++;
  }
  return ok>=3;
}
function hasVar(n){return n.t==='var'||(n.t==='grp'&&hasVar(n.x))||(n.t==='bin'&&(hasVar(n.a)||hasVar(n.b)));}
function numsOf(n,s=new Set()){if(n.t==='num')s.add(qText(n.v));else if(n.t==='grp')numsOf(n.x,s);else if(n.t==='bin'){numsOf(n.a,s);numsOf(n.b,s);}return s;}
function substV(n,x){switch(n.t){case 'var':return {t:'num',v:x,sv:true};case 'grp':return G(substV(n.x,x));case 'bin':return {...n,a:substV(n.a,x),b:substV(n.b,x)};default:return n;}}

const COL=['#7cff6b','#ff5fd2','#5ad1ff','#ffd24a'];
function rend(n,o={},ctx=''){
  const col=(node,html)=>o.color&&node.cid!=null?`<span class="pc" style="--c:${COL[node.cid%COL.length]}">${html}</span>`:html;
  switch(n.t){
    case 'num':{const s=qHTML(n.v);return col(n,ctx==='impR'?`(${s})`:s);}
    case 'var':return col(n,`<i>${n.name}</i>`);
    case 'grp':return `(${rend(n.x,o)})`;
    case 'bin':{
      if(n.imp){
        const L=rend(n.a,o),b=n.b;
        if(b.t==='num')return L+rend(b,o,'impR');
        if(b.t==='var'||b.t==='grp')return L+rend(b,o);
        return `${L} ${col(n,'<span class="op">·</span>')} ${rend(b,o)}`;
      }
      const sym={'+':'+','-':'−','*':'×','/':'÷'}[n.op];
      return `${rend(n.a,o)} ${col(n,`<span class="op">${sym}</span>`)} ${rend(n.b,o)}`;
    }
  }
}
const wordsHTML=(words,color)=>words.map(([t,c])=>color&&c!=null?`<span class="pc" style="--c:${COL[c%COL.length]}">${t}</span>`:t).join('');
const wordsText=words=>words.map(w=>String(w[0])).join('').replace(/<[^>]+>/g,'');

/* ---------------- Parsing the student's tiles ---------------- */
function tokenize(keys){
  const out=[];let num='';
  const flush=()=>{if(num){if(!/^\d+(\.\d+)?$/.test(num))throw new Error('num');out.push({t:'num',v:num});num='';}};
  for(const k of keys){
    if(/^[0-9.]$/.test(k)){num+=k;continue;}
    flush();
    if(/^[a-z]$/.test(k))out.push({t:'var',v:k});else out.push({t:'op',v:k});
  }
  flush();return out;
}
function parseTokens(keys){
  let toks;try{toks=tokenize(keys);}catch(e){return null;}
  if(!toks.length)return null;
  let i=0;
  const starts=t=>t&&(t.t==='num'||t.t==='var'||t.v==='(');
  function factor(){
    const t=toks[i];if(!t)throw new Error('end');
    if(t.t==='num'){i++;return N(t.v.includes('.')?dq(t.v):q(parseInt(t.v,10)));}
    if(t.t==='var'){i++;return V(t.v);}
    if(t.v==='('){i++;const e=expr();if(!toks[i]||toks[i].v!==')')throw new Error('paren');i++;return G(e);}
    throw new Error('factor');
  }
  function term(){
    let L=factor();
    for(;;){const t=toks[i];
      if(t&&t.t==='op'&&(t.v==='×'||t.v==='÷')){i++;const R=factor();L=B(t.v==='×'?'*':'/',L,R);}
      else if(starts(t)){const R=factor();L=B('*',L,R,true);}
      else break;}
    return L;
  }
  function expr(){
    let L=term();
    for(;;){const t=toks[i];
      if(t&&t.t==='op'&&(t.v==='+'||t.v==='−')){i++;const R=term();L=B(t.v==='+'?'+':'-',L,R);}
      else break;}
    return L;
  }
  try{const e=expr();return i===toks.length?e:null;}catch(e){return null;}
}
function toksHTML(keys){
  return keys.map(k=>/^[a-z]$/.test(k)?`<i>${k}</i>`:'+−×÷'.includes(k)?` <span class="op">${k}</span> `:k).join('');
}

/* ---------------- Diagnosis for translations ---------------- */
function diagnoseT(p,st){
  for(const tr of p.traps)if(equiv(st,tr.ast))return tr.kind;
  const A=p.ast;
  if(A.t==='bin'){
    if((A.op==='-'||A.op==='/')&&equiv(st,B(A.op,A.b,A.a)))return 'reversed';
    for(const op of ['+','-','*','/'])if(op!==A.op&&(equiv(st,B(op,A.a,A.b))||equiv(st,B(op,A.b,A.a))))return 'wrongop';
  }
  if(!hasVar(st))return 'novar';
  const want=numsOf(A),got=numsOf(st);
  if([...got].some(x=>!want.has(x))||[...want].some(x=>!got.has(x)))return 'wrongnum';
  return 'other';
}
function hintT(p,kind){
  const A=p.ast;
  switch(kind){
    case 'reversed':return A.op==='/'||(A.t==='bin'&&A.op==='/')
      ?'<b>Order matters with division!</b> “The quotient of A and B” and “A divided by B” both mean A ÷ B, in that order.'
      :'<b>Order matters with subtraction!</b> “Less than,” “fewer than,” and “subtracted from” flip the order: you start with the <u>other</u> amount and take this one away.';
    case 'wrongop':return '<b>Check the keyword.</b> sum / more / increased → <b>+</b> · difference / less / decreased → <b>−</b> · product / times / twice / each → <b>×</b> · quotient / divided / shared / half → <b>÷</b>';
    case 'parens':return '<b>Parentheses change the meaning!</b> If the message multiplies or divides a whole <u>sum</u> or <u>difference</u>, group that part with ( ). If it says “more than” or “less than” a product, no parentheses are needed.';
    case 'swap':return '<b>Which number goes with the variable?</b> The “each” or “per” amount is the one multiplied by the variable. The one-time amount is added or subtracted by itself.';
    case 'novar':return `<b>Your translation needs the variable!</b> Tap <i>${p.v}</i> for the unknown amount.`;
    case 'wrongnum':return '<b>Check your numbers.</b> Use exactly the numbers from the message.';
    default:return '<b>Not quite.</b> Break the message into chunks and translate one chunk at a time.';
  }
}
function beamHTML(p,ast,label='Yours'){
  // pick a test value that keeps the arithmetic friendly: whole, non-negative results if possible
  const cands=[];
  for(const x of [10,12,8,6,20,5,4,3,2,24,30,15,9,7,40,60,1]){
    let a,b;try{a=evq(p.ast,q(x));b=evq(ast,q(x));}catch(e){continue;}
    if(a.eq(b))continue;
    const whole=a.d===1&&b.d===1,pos=a.n>=0&&b.n>=0;
    cands.push({x,a,b,score:(whole?2:0)+(pos?1:0)});
  }
  cands.sort((m,n)=>n.score-m.score);
  for(const {x,a,b} of cands){
    return `🔬 <b>TEST BEAM:</b> let <i>${p.v}</i> = ${x}<br>Message: <span class="m">${rend(substV(p.ast,q(x)))} = <b class="g">${qHTML(a)}</b></span><br>${label}: <span class="m">${rend(substV(ast,q(x)))} = <b class="r">${qHTML(b)}</b></span> &nbsp;✗ not the same!`;
  }
  return '';
}

/* ---------------- Parts of an expression ---------------- */
function genParts(){
  const vs=shuffle(['x','y','a','b','m','n','k','t']);
  const nT=ri(2,4),hasConst=Math.random()<.85,nV=hasConst?nT-1:nT;
  let terms=[];const one=Math.random()<.45?ri(0,nV-1):-1;
  for(let i=0;i<nV;i++)terms.push({c:i===one?1:ri(2,9),v:vs[i]});
  if(terms.every(t=>t.c===1))terms[0].c=ri(2,9);
  if(hasConst){const c={c:ri(1,15),v:null};Math.random()<.75?terms.push(c):terms.splice(ri(0,terms.length),0,c);}
  // make numbers distinct so "tap the 4" is never ambiguous
  const used=new Set();terms.forEach(t=>{if(t.c===1&&t.v)return;while(used.has(t.c))t.c=t.v?ri(2,9):ri(10,19);used.add(t.c);});
  const qs=[{type:'terms',text:'How many <b>TERMS</b> are in this expression?',choices:['1','2','3','4','5'],answer:String(terms.length)}];
  const pool=[];
  const big=terms.map((t,i)=>({t,i})).filter(o=>o.t.v&&o.t.c>1);
  if(big.length){const o=pick(big);pool.push({type:'coef',v:o.t.v,text:`Tap the <b>COEFFICIENT</b> of <i>${o.t.v}</i>.`,target:{r:'coef',i:o.i}});}
  const ones=terms.filter(t=>t.v&&t.c===1);
  if(ones.length)pool.push({type:'coef1',v:ones[0].v,text:`What is the <b>COEFFICIENT</b> of <i>${ones[0].v}</i>?`,choices:['0','1',ones[0].v,'none'],answer:'1'});
  const ci=terms.findIndex(t=>!t.v);
  if(ci>=0)pool.push({type:'const',text:'Tap the <b>CONSTANT</b>.',target:{r:'const',i:ci}});
  pool.push({type:'var',text:'Tap a <b>VARIABLE</b>.',target:{r:'var'}});
  return {kind:'parts',terms,qs:qs.concat(shuffle(pool).slice(0,2))};
}
function partsHTML(terms){
  return terms.map((t,i)=>{
    const h=t.v?(t.c!==1?`<span class="pt" data-r="coef" data-i="${i}">${t.c}</span>`:'')+`<span class="pt" data-r="var" data-i="${i}"><i>${t.v}</i></span>`
               :`<span class="pt" data-r="const" data-i="${i}">${t.c}</span>`;
    return (i?' <span class="op">+</span> ':'')+h;
  }).join('');
}
function partsHint(qn,r,i,terms){
  if(qn.type==='coef'){
    if(r==='var')return 'That\'s a <b>variable</b>. The coefficient is the <u>number multiplied by</u> the variable.';
    if(r==='const')return 'That\'s the <b>constant</b>: it has no variable. A coefficient is attached to a variable.';
    return `That's the coefficient of <i>${terms[i].v}</i>. Find the term with <i>${qn.v}</i>.`;
  }
  if(qn.type==='const'){
    if(r==='coef')return 'That number is a <b>coefficient</b>: it multiplies a variable. A constant stands alone.';
    return 'That\'s a <b>variable</b>. The constant is the number with no variable attached.';
  }
  if(qn.type==='var')return r==='coef'?'That\'s a <b>coefficient</b>. A variable is a <u>letter</u> that stands for a number.':'That\'s the <b>constant</b>. A variable is a <u>letter</u> that stands for a number.';
  if(qn.type==='terms')return '<b>Terms</b> are the parts separated by + or − signs. Count the parts.';
  return `When no number is written, the coefficient is <b>1</b>: <i>${qn.v}</i> means 1<i>${qn.v}</i>.`;
}

/* ---------------- Reverse transmissions ---------------- */
function genReverse(){
  for(let k=0;k<200;k++){
    const P=newP();const pool=[...S1,...S2,...S3];
    const cor=pick(Math.random()<.45?S3:Math.random()<.6?S2:S1)(P);
    const corText=wordsText(cor.words);
    const cands=shuffle(pool).map(f=>f(P)).filter(o=>!equiv(o.ast,cor.ast));
    const trapAsts=(cor.traps||[]).map(t=>t.ast);
    if(cor.ast.op==='-'||cor.ast.op==='/')trapAsts.push(B(cor.ast.op,cor.ast.b,cor.ast.a));
    const hot=cands.filter(o=>trapAsts.some(a=>equiv(a,o.ast))),cold=cands.filter(o=>!hot.includes(o));
    const chosen=[],seenT=new Set([corText]),seenA=[];
    for(const o of [...hot.slice(0,2),...cold]){
      const tx=wordsText(o.words);if(seenT.has(tx)||seenA.some(a=>equiv(a,o.ast)))continue;
      seenT.add(tx);seenA.push(o.ast);chosen.push(o);if(chosen.length===3)break;
    }
    if(chosen.length<3)continue;
    const options=shuffle([{...cor,correct:true},...chosen.map(o=>({...o,correct:false}))]);
    return {kind:'reverse',v:P.v,ast:cor.ast,words:cor.words,traps:cor.traps||[],options};
  }
}

function tone(f,dur,type='sine',vol=.13,when=0,f2){
  if(S.muted)return;const c=ac();if(!c)return;
  const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();

}

function confetti(big){
  const cv=$('#fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#7cff6b','#ff5fd2','#5ad1ff','#ffd24a','#ffffff','#b9a8ff'];
  const P=Array.from({length:big?220:90},()=>({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
    s:4+Math.random()*7,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,star:Math.random()<.25}));
  const t0=performance.now();
  (function fr(t){cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.star){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?p.s*.45:p.s;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.closePath();cx.fill();}
      else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(t-t0<(big?3200:1700))requestAnimationFrame(fr);else cx.clearRect(0,0,cv.width,cv.height);})(t0);
}

  if(qn.choices){comms('Use the answer buttons for this question.','warn');return;}
  S.checks++;
  const ok=qn.target.r===r&&(qn.target.i===undefined||qn.target.i===i);
  if(ok){el.classList.add('good');partRight();return;}
  el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500);
  partWrong(partsHint(qn,r,i,p.terms),()=>{$$('#pexpr .pt').forEach(e=>{if(e.dataset.r===qn.target.r&&(qn.target.i===undefined||+e.dataset.i===qn.target.i))e.classList.add('good');});});
}
function onChoice(el){
  if(S.phase!=='parts')return;
  const qn=S.p.qs[S.qi];S.checks++;
  if(el.dataset.c===qn.answer){el.classList.add('right');partRight();return;}
  el.classList.add('wrong');
  partWrong(partsHint(qn,null,null,S.p.terms),()=>{$$('#choices .opt').forEach(e=>{if(e.dataset.c===qn.answer)e.classList.add('right');});});
}

/* ---- reverse mode ---- */
function onOption(i,el){
  if(S.phase!=='choose')return;
  const p=S.p,o=p.options[i];S.checks++;
  if(o.correct){S.correct++;el.classList.add('right');S.phase='done';updateTries();finish();return;}
  el.classList.add('wrong');S.tries++;S.routeMiss++;tally('rev');wrongFX();
  const beam=beamHTML(p,o.ast,'That phrase');
  $('#beam').innerHTML=`<div class="beam">That phrase means <span class="m">${rend(o.ast)}</span>, not <span class="m">${rend(p.ast)}</span>.${beam?'<br>'+beam:''}</div>`;
  if(S.tries<2){comms('👽 <b>Not that one.</b> Translate each phrase in your head, then compare it to the expression.','bad');updateTries();}
  else{
    S.phase='done';S.revealed=true;updateTries();
    $$('.opt').forEach((e,k)=>{if(p.options[k].correct)e.classList.add('right');});
    comms('👽 <b>Transmission lost.</b> The correct phrase is highlighted.','bad');
    setTimeout(()=>showModal(`<h3 class="bad">👽 Lost in translation</h3>${mapHTML(p)}
      <div class="beam">You chose “${wordsHTML(o.words,false)}”, which means <span class="m">${rend(o.ast)}</span>.${beam?'<br>'+beam:''}</div>`,
      [{label:S.route===SECTORS[S.zone].n-1?'FINISH SECTOR ▶':'NEXT TRANSMISSION ▶',fn:()=>{S.zstats[S.zone].res[S.route]='bust';advance();}}]),700);
  }
}

/* ---- finishing a transmission ---- */
function updateHud(){
  const t=$('#pts');if(t)t.textContent='⭐ '+fmt(S.score);
  const s=$('#streak');if(s)s.textContent='🔥 '+S.streak;
  const l=$('#lights');if(l)l.innerHTML=lightsHTML();
}
function finish(){
  const p=S.p,clean=S.routeMiss===0;
  const res=clean&&!S.backup?'first':'later';
  let pts=S.backup?(clean?40:20):(clean?100:50);
  const bonus=res==='first'?Math.min(S.streak,5)*20:0;pts+=bonus;
  if(clean){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);}else S.streak=0;
  S.score+=pts;S.zstats[S.zone].pts+=pts;S.zstats[S.zone].res[S.route]=res;updateHud();
  SFX.good();mood('happy');confetti(false);
  comms(pick(['👽 The alien understood perfectly!','Message decoded. The alien is delighted.','Translation accepted!']),'good');
  const body=p.kind==='parts'
    ?`<div class="map"><div class="ex">${p.terms.map((t,i)=>(i?' + ':'')+(t.v?(t.c!==1?t.c:'')+`<i>${t.v}</i>`:t.c)).join('')}</div>
        <div style="font-size:1rem;line-height:1.6;margin-top:.3rem"><b>${p.terms.length} terms</b> · variables: ${p.terms.filter(t=>t.v).map(t=>`<i class="v">${t.v}</i>`).join(', ')} · coefficients: ${p.terms.filter(t=>t.v).map(t=>`${t.c} (of <i class="v">${t.v}</i>)`).join(', ')}${p.terms.some(t=>!t.v)?` · constant: ${p.terms.find(t=>!t.v).c}`:' · no constant'}</div></div>`
    :mapHTML(p);
  const last=S.route===SECTORS[S.zone].n-1;
  setTimeout(()=>showModal(`<h3 class="good">📡 ${p.kind==='parts'?'Vocabulary check passed!':'Translation accepted!'}</h3>${body}
    <div class="ptsline">+${fmt(pts)} points${bonus?` <span style="color:#ff9a4d;font-size:.9rem">(includes 🔥 streak bonus +${bonus})</span>`:''}</div>`,
    [{label:last?'FINISH SECTOR ▶':'NEXT TRANSMISSION ▶',fn:advance}]),800);
}
function advance(){
  S.route++;
  if(S.route<SECTORS[S.zone].n){newRoute(false);return;}
  const z=SECTORS[S.zone],zs=S.zstats[S.zone],firsts=zs.res.filter(r=>r==='first').length;
  const stars=firsts>=z.n?3:firsts>=z.n-1?2:firsts>=1?1:0;zs.stars=stars;
  confetti(true);SFX.win();
  const last=S.zone===SECTORS.length-1;
  showModal(`<div style="text-align:center"><div style="font-size:3rem">${z.icon}</div>
    <h3 class="gold">SECTOR ${S.zone+1} CLEARED!</h3><div style="color:var(--muted)">${z.name}</div>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
    <div style="color:var(--muted);font-size:.9rem;margin-bottom:.4rem">${firsts} of ${z.n} transmissions perfect on the first try</div>
    <div class="ptsline">${fmt(zs.pts)} points from this sector</div></div>`,
    [{label:last?'SEE MISSION REPORT ▶':'NEXT SECTOR ▶',fn:()=>{S.zone++;if(S.zone>=SECTORS.length)showReport();else showBrief();}}]);
}

/* ================= REPORT ================= */
function showReport(){
  clearInterval(S.timer);
  const time=elapsed(),acc=S.checks?Math.round(100*S.correct/S.checks):0;
  const played=SECTORS.map((z,i)=>i).filter(i=>i>=S.start);
  const stars=played.reduce((s,i)=>s+(S.zstats[i].stars||0),0),maxStars=played.length*3;
  const rank=acc>=90&&stars>=maxStars*.8?['🌟','GALACTIC AMBASSADOR']:acc>=75?['🛸','SENIOR TRANSLATOR']:acc>=55?['📡','TRANSLATOR']:['🎒','CADET TRANSLATOR'];
  const best=store.get('gt_best',0),newBest=S.score>best;if(newBest)store.set('gt_best',S.score);
  const rev=Object.entries(S.mistakes).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  const icon=r=>r==='first'?'⭐':r==='later'?'📡':r==='bust'?'🚨':'·';
  app.innerHTML=`<div class="screen"><div class="report card">
    <div class="kicker">MISSION REPORT · LESSON 3-4 · WRITE ALGEBRAIC EXPRESSIONS</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px">
      <div><div style="color:var(--muted)">${new Date().toLocaleDateString()}</div><div class="rank">${rank[0]} ${rank[1]}</div></div>
      ${newBest?'<div class="stat pts">🏆 New best on this device!</div>':''}
    </div>
    <div class="grid4">
      <div class="big"><b style="color:var(--green)">${fmt(S.score)}</b><small>Total points</small></div>
      <div class="big"><b>${acc}%</b><small>Answer accuracy</small></div>
      <div class="big"><b>${stars}/${maxStars}</b><small>Sector stars</small></div>
      <div class="big"><b>${clock(time)}</b><small>Mission time</small></div>
    </div>
    <div class="label">Sectors</div>
    ${played.map(i=>`<div class="vrow"><span>${SECTORS[i].icon} ${SECTORS[i].name} <span style="color:var(--muted);font-size:.85rem">· ${SECTORS[i].skill}</span></span>
      <span class="s">${Array.from({length:SECTORS[i].n},(_,k)=>icon(S.zstats[i].res[k])).join(' ')}</span></div>`).join('')}
    <div style="color:var(--muted);font-size:.82rem;margin-top:.4rem">⭐ perfect first try · 📡 completed with a fix · 🚨 lost in translation</div>
    ${rev.length?`<div class="review"><b style="color:var(--yellow)">🎯 Skills to sharpen:</b><br>${rev.map(([k,n])=>`• ${MISTAKE_TXT[k]} <span style="color:var(--muted)">(${n}×)</span>`).join('<br>')}</div>`
      :'<div class="review" style="border-color:rgba(124,255,107,.45);background:rgba(124,255,107,.07)"><b style="color:var(--green)">Flawless!</b> Every alien understood you perfectly.</div>'}
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:1rem"><button class="btn plain" id="home">Home</button><button class="btn${IN_TOWN?' plain':''}" id="again">PLAY AGAIN ▶</button>${IN_TOWN?'<button class="btn" id="townDone">SAVE &amp; RETURN TO TOWN ▶</button>':''}</div>
  </div></div>`;
  confetti(true);SFX.win();
  $('#again').onclick=()=>startGame(S.start);$('#home').onclick=showTitle;
  const td=$('#townDone');
  if(td)td.onclick=()=>toTown({type:'CARTRIDGE_COMPLETE',payload:{
    lessonId:'G06_U03_L04',
    score:Math.max(1,S.correct||0), // hub stars come from score/total (answer accuracy)
    total:Math.max(1,S.checks||0),
    stars:maxStars?Math.max(1,Math.min(3,Math.round(stars/maxStars*3))):1,
    accuracy:acc,
    bossDefeated:true, // the report only appears after the Reverse Transmission sector
  }});
}

/* ---------------- Keyboard ---------------- */
document.addEventListener('keydown',e=>{
  if(!$('#modal').classList.contains('hidden')){
    if(e.key==='Enter'&&modalBtns[0]){e.preventDefault();const b=modalBtns[0];hideModal();b.fn();}return;
  }
  if(S.phase!=='build')return;
  const k=e.key;
  if(/^[0-9.]$/.test(k))pressKey(k);
  else if(k.toLowerCase()===S.p.v)pressKey(S.p.v);
  else if(k==='+')pressKey('+');
  else if(k==='-')pressKey('−');
  else if(k==='*')pressKey('×');
  else if(k==='/'){e.preventDefault();pressKey('÷');}
  else if(k==='('||k===')')pressKey(k);
  else if(k==='Backspace'){e.preventDefault();pressKey('back');}
  else if(k==='Escape')pressKey('clr');
  else if(k==='Enter'){e.preventDefault();submitT();}
});

showTitle();

// Expression Town handshake: announce readiness, then follow the hub's mute setting
if(IN_TOWN)toTown({type:'CARTRIDGE_READY'});
window.addEventListener('message',ev=>{
  const d=ev.data;if(!d||typeof d!=='object'||d.type!=='HUB_INIT')return;
  const p=d.payload||{};
  if(typeof p.isMuted==='boolean'){S.muted=p.isMuted;const m=$('#mute');if(m)m.textContent=S.muted?'🔇':'🔊';}
});
}
</script>
