<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siege of the Expression Colossus · Topic 3 Capstone</title>
<meta name="description" content="Topic 3 capstone boss fight for enVision 2.0 Grade 6: exponents, GCF, LCM, order of operations, writing and evaluating expressions, the Distributive Property, and combining like terms.">
<style>
:root{
  --ink:#1d1433; --stone:#2a2140; --stone2:#3a2f58; --cream:#fff4d6; --cream2:#f6e7bf; --gold:#ffd23f; --red:#e5484d;
  --green:#2fbf71; --muted:#b9aed8; --text:#f4eeff;
  --math:"Cambria Math","Cambria","Times New Roman",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:radial-gradient(900px 500px at 25% 30%,#4a2a5e 0%,transparent 65%),radial-gradient(700px 500px at 90% 100%,#3b1420 0%,transparent 60%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 92px),#1a1330}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
i.v,.prompt i,.choice i,.work i,.disp i,.mbox i,.story i{font-family:var(--math);font-style:italic;color:#ffe27a}
sup{font-size:.62em;line-height:0}

#game{height:100vh;display:grid;grid-template-rows:56px 1fr}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:14px;padding:6px 14px;background:linear-gradient(180deg,#120c22,#1d1433);border-bottom:3px solid #000}
.hud .title{font-weight:900;letter-spacing:.06em;font-size:.95rem;white-space:nowrap}
.hud .title span{display:block;font-size:.68rem;color:var(--gold);letter-spacing:.14em}
.hearts{display:flex;gap:3px;font-size:1.35rem;line-height:1}
.hearts .h{transition:transform .2s}
.hearts .h.lost{filter:grayscale(1) brightness(.45)}
.hearts .h.break{animation:hbreak .6s}
@keyframes hbreak{30%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1)}}
.bosshp{flex:1;display:flex;align-items:center;gap:8px;min-width:200px}
.bosshp .lbl{font-size:.68rem;font-weight:900;letter-spacing:.14em;color:#ff9aa0;white-space:nowrap}
.bar{flex:1;display:flex;gap:3px;height:18px;padding:3px;background:#000;border-radius:6px;border:2px solid #5e1d26}
.seg{flex:1;border-radius:2px;background:linear-gradient(180deg,#ff6b70,#b8232a)}
.seg.core{background:linear-gradient(180deg,#ffe27a,#e09a12)}
.seg.gone{background:#2b1a22}
.stat{background:#000;border:2px solid #3a2f58;border-radius:10px;padding:.25rem .6rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{background:#000;border:2px solid #3a2f58;border-radius:10px;padding:.25rem .6rem;font-weight:900;min-width:38px}
.iconbtn:hover{border-color:var(--gold)}

/* ---------- Arena ---------- */
main{display:grid;grid-template-columns:44% 56%;min-height:0}
.arena{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:8px 6px 4px;min-height:0}
.arena::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:22%;background:radial-gradient(closest-side,rgba(255,120,60,.18),transparent);pointer-events:none}
#colossus{height:100%;max-height:100%;width:100%;overflow:visible}
.taunt{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:88%;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  padding:.45rem .8rem;font-weight:800;font-size:.95rem;line-height:1.3;text-align:center;z-index:2;box-shadow:0 4px 0 #000}
.taunt::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--ink);border-bottom:0}
.taunt.pop{animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}}

.plate{cursor:pointer;transition:filter .15s}
.plate path.body{stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.plate .shine{fill:none;stroke:rgba(255,255,255,.45);stroke-width:3;stroke-linecap:round}
.plate text{font-weight:900;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:var(--ink);stroke-width:3.5px;pointer-events:none}
.plate .crack{display:none;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.plate:hover,.plate:focus,.plate.sel{filter:brightness(1.3) drop-shadow(0 0 7px #ffd23f);outline:none}
.plate.locked{cursor:default}
.plate.locked:hover{filter:none}
.plate.broken{cursor:default;filter:none}
.plate.broken path.body{fill:#2b2340!important;stroke-dasharray:6 4;opacity:.75}
.plate.broken .shine{display:none}
.plate.broken .crack{display:inline}
.plate.broken text{opacity:.4}
.plate.hit{animation:plateHit .5s}
@keyframes plateHit{0%,40%{filter:brightness(3)}20%{transform:translate(4px,-3px)}60%{transform:translate(-4px,2px)}}
#core circle.orb{transition:fill .3s}
#core.locked circle.orb{fill:#5a4a2a}
#core.locked .cage{display:inline}
#core .cage{display:none;stroke:#8f86a8;stroke-width:3}
#core.exposed{cursor:default}
#core.exposed circle.orb{fill:url(#coreGlow);animation:corePulse 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes corePulse{to{transform:scale(1.15)}}
.eye{animation:eyeGlow 1.6s ease-in-out infinite alternate}
@keyframes eyeGlow{from{opacity:.6}to{opacity:1}}
.colossus-body{transform-box:fill-box;transform-origin:50% 100%}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.collapse{animation:collapse 2.2s forwards}
@keyframes collapse{30%{transform:rotate(-4deg)}100%{transform:translateY(60px) rotate(8deg) scaleY(.4);opacity:0}}
.floater{font-weight:900;font-size:22px;text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:5px;animation:floatUp 1.1s forwards}
@keyframes floatUp{to{transform:translateY(-46px);opacity:0}}

/* ---------- Panel ---------- */
.panel{padding:12px 16px 12px 6px;display:flex;flex-direction:column;gap:10px;min-height:0}
.phase{font-size:.75rem;font-weight:900;letter-spacing:.16em;color:var(--gold)}
.phase span{color:var(--muted)}
.card{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 #000}
.card i{color:#6a3cc9!important}
.panel h2{margin:0;font-size:1.5rem}
.sub{margin:0;color:var(--muted);font-size:.98rem;line-height:1.4}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.pbtn{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(180deg,#3a2f58,#2a2140);border:3px solid var(--ink);border-left:10px solid var(--c);
  border-radius:12px;padding:.55rem .7rem;box-shadow:0 4px 0 #000;transition:transform .08s}
.pbtn:hover{transform:translateY(-2px);border-color:var(--gold);border-left-color:var(--c)}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.pbtn .k{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#000;font-weight:900;font-size:.85rem;color:var(--gold);flex:none}
.pbtn b{display:block;font-size:1rem}
.pbtn small{color:var(--muted);font-size:.8rem}
.pbtn.done{opacity:.45;cursor:default;transform:none}
.pbtn.done .k{color:var(--green)}

.qcard{padding:12px 16px}
.chip{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.1em;padding:.2rem .55rem;border-radius:999px;background:var(--c,#1d1433);color:#fff;border:2px solid var(--ink)}
.prompt{font-size:1.5rem;line-height:1.4;font-weight:700;margin-top:.35rem}
.prompt .m,.choice .m{font-family:var(--math);font-weight:400}
.story{font-size:1.08rem;font-weight:600;line-height:1.45;background:var(--cream2);border-radius:10px;padding:.45rem .7rem;margin:.35rem 0 .2rem}
.prompt .ask{font-size:1.2rem}
.timer{height:12px;background:#000;border:2px solid #3a2f58;border-radius:8px;overflow:hidden}
.timer div{height:100%;background:linear-gradient(90deg,#2fbf71,#ffd23f);transition:width .1s linear}
.timer.low div{background:linear-gradient(90deg,#e5484d,#ff8a2b)}
.ansrow{display:grid;grid-template-columns:1fr 290px;gap:12px;align-items:stretch}
.disp{font-family:var(--math);font-size:2.6rem;min-height:4.2rem;background:#000;color:#fff36b;border:3px solid #3a2f58;border-radius:14px;padding:.2rem .9rem;
  display:flex;align-items:center;justify-content:flex-end;text-shadow:0 0 12px rgba(255,210,63,.45)}
.disp .cur{display:inline-block;width:3px;height:1em;background:var(--gold);margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.disp.err{border-color:var(--red);animation:shake .4s}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{background:linear-gradient(180deg,#4a3f6e,#2f2650);border:2px solid var(--ink);border-radius:11px;padding:.55rem 0;font-size:1.25rem;font-weight:900;box-shadow:0 3px 0 #000}
.key:active{transform:translateY(2px);box-shadow:none}
.key.s{font-size:.82rem;color:#ffb3b8}
.key.go{grid-column:span 2;background:linear-gradient(180deg,#ff7a7e,#c42d33);font-size:1.05rem;letter-spacing:.08em}
.key.zero{grid-column:span 2}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(180deg,#4a3f6e,#2f2650);border:3px solid var(--ink);border-radius:14px;padding:.75rem .9rem;
  font-size:1.35rem;box-shadow:0 4px 0 #000;min-height:64px}
.choice:hover{border-color:var(--gold)}
.choice .k{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#000;font-weight:900;font-size:.85rem;color:var(--gold);flex:none;font-family:inherit;font-style:normal}
.choice .m{font-family:var(--math)}
.choice.wide{grid-column:1 / -1}
.choices.two .choice{font-size:1.15rem}

.fb{padding:12px 16px;line-height:1.45;font-size:1.02rem}
.fb h3{margin:0 0 .3rem;font-size:1.3rem}
.fb.bad{border-color:var(--red);background:#ffe9e9}
.fb.bad h3{color:#b8232a}
.fb.good{background:#e3f9ea;border-color:#1b8a4f}
.fb.good h3{color:#1b8a4f}
.work{margin-top:.5rem;background:#fff;border:2px dashed #b7a98a;border-radius:10px;padding:.5rem .7rem;font-size:1.05rem}
.work .m{font-family:var(--math);font-size:1.2rem}
.fb .row{display:flex;justify-content:flex-end;margin-top:10px}

.btn{background:linear-gradient(180deg,#ffe27a,#f2b51d);color:var(--ink);font-weight:900;letter-spacing:.06em;padding:.7rem 1.3rem;border-radius:12px;border:3px solid var(--ink);box-shadow:0 4px 0 #000;font-size:1rem}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.red{background:linear-gradient(180deg,#ff7a7e,#c42d33);color:#fff}
.btn.plain{background:#fff;color:var(--ink)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,4,18,.78);display:grid;place-items:center;z-index:40;padding:14px}
.mbox{max-width:860px;width:100%;max-height:96vh;overflow:auto;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 #000;padding:20px 24px;animation:rise .3s}
@keyframes rise{from{transform:translateY(18px);opacity:0}}
.mbox .kicker{font-size:.75rem;font-weight:900;letter-spacing:.18em;color:#b8232a}
.mbox h1{margin:.1rem 0 .3rem;font-size:2rem;line-height:1.1}
.mbox h2{margin:.1rem 0 .4rem;font-size:1.8rem}
.mbox p{margin:.3rem 0;line-height:1.45}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:.7rem 0}
.tri div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.6rem .75rem;font-size:.92rem;line-height:1.4}
.tri b.h{display:block;font-size:1rem;margin-bottom:.15rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:.4rem 0 .2rem}
.legend span{font-size:.78rem;font-weight:800;padding:.22rem .55rem;border-radius:999px;color:#fff;border:2px solid var(--ink);background:var(--c)}
.mbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:.6rem 0}
.big{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.45rem;text-align:center}
.big b{display:block;font-size:1.45rem}
.big small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#6b5e88;font-weight:800}
table.mastery{width:100%;border-collapse:collapse;font-size:.92rem}
table.mastery td,table.mastery th{padding:.28rem .45rem;border-bottom:2px solid #e7d8ad;text-align:left}
table.mastery th{font-size:.7rem;letter-spacing:.12em;color:#6b5e88}
table.mastery .code{font-weight:900;color:#fff;background:var(--c);border-radius:6px;padding:.08rem .4rem;border:2px solid var(--ink);font-size:.78rem;white-space:nowrap}
.review{margin-top:.6rem;background:#fff3d1;border:3px solid #e0a91a;border-radius:12px;padding:.5rem .8rem;line-height:1.5;font-size:.95rem}
.review.ok{background:#e3f9ea;border-color:#2fbf71}

#flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(circle,transparent 35%,rgba(229,72,77,.55));opacity:0}
#flash.on{animation:alarm .7s}
#flash.gold{background:radial-gradient(circle,transparent 35%,rgba(255,210,63,.45))}
@keyframes alarm{0%,50%{opacity:1}25%,75%,100%{opacity:0}}
.screen-shake{animation:shake .4s}

@media (max-height:660px){
  #game{grid-template-rows:50px 1fr}
  .prompt{font-size:1.25rem}.disp{font-size:2.1rem;min-height:3.4rem}.key{padding:.4rem 0;font-size:1.1rem}
  .choice{min-height:52px;font-size:1.15rem;padding:.55rem .8rem}.pbtn{padding:.4rem .6rem}.panel{gap:7px}.panel h2{font-size:1.25rem}
}
</style>

<body>
<div id="game">
  <header class="hud">
    <div class="title">🏰 BOSS CASTLE<span>EXPRESSION COLOSSUS PRIME</span></div>
    <div class="hearts" id="hearts" aria-label="Hearts"></div>
    <div class="bosshp"><div class="lbl">COLOSSUS</div><div class="bar" id="bossbar"></div></div>
    <div class="stat" id="clock">⏱ 0:00</div>
    <button class="iconbtn" id="help" aria-label="Mission briefing">?</button>
    <button class="iconbtn" id="mute" aria-label="Toggle sound">🔊</button>
  </header>
  <main>
    <section class="arena" id="arena">
      <div class="taunt" id="taunt"></div>
      <svg id="colossus" viewBox="0 0 420 460" aria-label="The Expression Colossus"></svg>
    </section>
    <section class="panel" id="panel"></section>
  </main>
</div>
<div id="flash"></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* =====================================================================
   SIEGE OF THE EXPRESSION COLOSSUS · enVision 2.0 Grade 6 · Topic 3 Capstone
   Phase 1: one armor plate per lesson (3-1 … 3-7, with GCF and LCM for 3-2)
   Phase 2: two-step combo attacks that mix lessons
   ===================================================================== */

/* ---------------- Helpers ---------------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
const lcm=(a,b)=>a/gcd(a,b)*b;
const I=v=>`<i>${v}</i>`;
const P=(b,e)=>`${b}<sup>${e}</sup>`;
const T=(c,v)=>c===1?I(v):`${c}${I(v)}`;           // a term like 3x (1x is written x)
const times=(b,e,sep=' · ')=>Array(e).fill(b).join(sep);
const VARS=['x','n','y','k','m','p','t','w'];
const same=(a,b)=>Math.abs(a-b)<1e-9;

/** Accepts 15, 15.00, $15, " 15 ", 1,000. Returns a number or null. */
function parseNum(s){
  s=String(s==null?'':s).trim().replace(/[$,\s]/g,'');
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return null;
  return Number(s);
}
/** Two expressions (functions of x, y) are equivalent if they agree on many inputs. */
function equivFn(f,g){
  for(const x of [2,3,5,7,11])for(const y of [3,4,6]){if(!same(f(x,y),g(x,y)))return false;}
  return true;
}
/** Numeric question. diag(n) returns [mistakeKey, message] for a wrong answer n. */
function num(lesson,prompt,answer,explain,diag,meta={}){
  return {lesson,kind:'num',prompt,answer,explain,diag,...meta};
}
/** Multiple-choice question with one right answer. Distractors that mean the same thing as
    the answer are dropped unless marked `equivalent` (e.g. factoring with a smaller factor). */
function mkChoice(o){
  const need=o.need||3,chosen=[],seen=new Set([o.correct.html]);
  for(const d of o.wrong){
    if(chosen.length===need)break;
    if(seen.has(d.html))continue;
    if(o.correct.f&&d.f&&!d.equivalent&&equivFn(o.correct.f,d.f))continue;
    seen.add(d.html);chosen.push({...d,correct:false});
  }
  if(chosen.length<need)return null;
  return {lesson:o.lesson,kind:'choice',prompt:o.prompt,explain:o.explain,target:o.correct.f||null,
    options:shuffle([{html:o.correct.html,f:o.correct.f,correct:true},...chosen])};
}
function retry(gen){for(let i=0;i<300;i++){const q=gen();if(q)return q;}throw new Error('generator failed');}

/* ---------------- 3-1 Exponents ---------------- */
function gExpEval(){
  let b,e;do{b=ri(2,9);e=ri(2,4);}while(b**e>800||(b===2&&e===2));
  const v=b**e;
  return num('3-1',`Evaluate <span class="m">${P(b,e)}</span>.`,v,`${P(b,e)} = ${times(b,e,' × ')} = <b>${v}</b>`,n=>
    n===b*e?['expMul',`${b} × ${e} = ${b*e}. But ${P(b,e)} means ${b} used as a factor ${e} times.`]
    :n===e**b?['expSwap',`That's ${P(e,b)}. The base ${b} is the number that repeats; the exponent ${e} counts the repeats.`]
    :['exp',`Multiply it out one step at a time: ${times(b,e,' × ')}.`],{js:`${b}**${e}`});
}
function gExpWrite(){
  const b=ri(2,9);let e;do{e=ri(3,6);}while(e===b);
  return mkChoice({lesson:'3-1',prompt:`Write <span class="m">${times(b,e)}</span> using an exponent.`,
    correct:{html:P(b,e)},
    wrong:shuffle([
      {html:P(e,b),key:'expSwap',why:`${P(e,b)} would mean ${e} used as a factor ${b} times.`},
      {html:`${b} × ${e}`,key:'expMul',why:`${b} × ${e} = ${b*e}. Repeated multiplication is written with an exponent.`},
      {html:P(b,e-1),key:'exp',why:`Count the factors again: there are ${e} of them.`},
      {html:P(b,e+1),key:'exp',why:`Count the factors again: there are ${e} of them.`},
    ]),
    explain:`There are ${e} factors of ${b}, so it's <b>${P(b,e)}</b>.`});
}
function gExpCompare(){
  const [a,b]=pick([[2,5],[3,4],[2,6],[2,3],[3,5],[2,4],[4,5]]);
  const [x,y]=Math.random()<.5?[a,b]:[b,a];
  const X=x**y,Y=y**x;
  const vals=`${P(x,y)} = ${times(x,y,' × ')} = ${X}, and ${P(y,x)} = ${times(y,x,' × ')} = ${Y}`;
  const opts=[{html:P(x,y),correct:X>Y},{html:P(y,x),correct:Y>X},{html:'They are equal',correct:X===Y,text:true}];
  opts.forEach(o=>{if(!o.correct){o.key='expCompare';o.why=`Compute both before you compare: ${vals}.`;}});
  return {lesson:'3-1',kind:'choice',prompt:`Which is greater: <span class="m">${P(x,y)}</span> or <span class="m">${P(y,x)}</span>?`,options:opts,explain:`${vals}.`,meta:{x,y}};
}

/* ---------------- 3-2 GCF and LCM ---------------- */
function gcfPair(){let g,m,n;do{g=ri(2,12);m=ri(2,9);n=ri(2,9);}while(m===n||gcd(m,n)!==1||g*m>96||g*n>96);return {a:g*m,b:g*n,g,m,n};}
function lcmPair(){let a,b;do{a=ri(2,15);b=ri(2,15);}while(a===b||a%b===0||b%a===0||lcm(a,b)>120);return {a,b,L:lcm(a,b)};}
function gcfDiag(a,b){
  return n=>n===lcm(a,b)||n===a*b?['gcfLcm',`${n} is a common <b>multiple</b>. The GCF is a <b>factor</b>: the greatest number that divides both ${a} and ${b}.`]
    :n>0&&a%n===0&&b%n===0?['gcfNotGreatest',`${n} divides both, so it's a common factor, but there's a greater one.`]
    :['gcf',`${n} doesn't divide both ${a} and ${b}. Find the greatest number that divides both evenly.`];
}
function gcfExplain(p){return `${p.a} = ${p.g} × ${p.m} and ${p.b} = ${p.g} × ${p.n}. ${p.m} and ${p.n} share no factor greater than 1, so the GCF is <b>${p.g}</b>.`;}
function lcmDiag(a,b){
  const L=lcm(a,b);

    :n===a*b&&n!==L?['lcmProduct',`${a} × ${b} = ${n} is a common multiple, but not the <b>least</b> one.`]
    :n>0&&n%a===0&&n%b===0?['lcmNotLeast',`${n} is a common multiple, but there's a smaller one.`]

}
function lcmExplain(a,b){

/* ---------------- 3-3 Order of operations ---------------- */
const PEM=[
  ()=>{const a=ri(2,20),b=ri(2,9),c=ri(2,9);return {html:`${a} + ${b} × ${c}`,js:`${a}+${b}*${c}`,ans:a+b*c,
    steps:`${b} × ${c} = ${b*c}, then ${a} + ${b*c} = <b>${a+b*c}</b>`,alts:[[(a+b)*c,'pemdasLtr',`Multiply before you add: do ${b} × ${c} first.`]]};},
  ()=>{const a=ri(2,6),b=ri(1,9),c=ri(1,9),s=a*(b+c),d=ri(1,s-1);return {html:`${a} × (${b} + ${c}) − ${d}`,js:`${a}*(${b}+${c})-${d}`,ans:s-d,
    steps:`(${b} + ${c}) = ${b+c}, then ${a} × ${b+c} = ${s}, then ${s} − ${d} = <b>${s-d}</b>`,alts:[[a*b+c-d,'pemdasParens',`Parentheses come first: add ${b} + ${c} before you multiply.`]]};},
  ()=>{const a=ri(1,20),b=ri(2,5),c=ri(2,4);return {html:`${a} + ${P(b,2)} × ${c}`,js:`${a}+${b}**2*${c}`,ans:a+b*b*c,

    alts:[[a+b*2*c,'expMul',`${P(b,2)} means ${b} × ${b}, not ${b} × 2.`],[(a+b*b)*c,'pemdasLtr','After the exponent, multiply before you add.']]};},
  ()=>{const s=ri(3,10),divs=[];for(let c=2;c<=12;c++)if((s*s)%c===0)divs.push(c);const c=pick(divs),a=ri(1,s-1),b=s-a;
    return {html:`(${a} + ${b})<sup>2</sup> ÷ ${c}`,js:`(${a}+${b})**2/${c}`,ans:s*s/c,
    steps:`(${a} + ${b}) = ${s}, then ${P(s,2)} = ${s*s}, then ${s*s} ÷ ${c} = <b>${s*s/c}</b>`,alts:[[a+b*b/c,'pemdasParens','Do the parentheses first, then the exponent.'],[s*2/c,'expMul',`${P(s,2)} means ${s} × ${s}.`]]};},
  ()=>{const c=ri(2,6),k=ri(2,9),b=c*k,a=ri(k,k+20),d=ri(1,15);return {html:`${a} − ${b} ÷ ${c} + ${d}`,js:`${a}-${b}/${c}+${d}`,ans:a-k+d,

/* ---------------- 3-4 Write algebraic expressions ---------------- */
function gWrite(){
  const v=pick(VARS),x=I(v),a=ri(2,12);let b;do{b=ri(2,6);}while(b===a);
  const TPL=[
    ()=>({p:`${a} less than ${x}`,c:{html:`${x} − ${a}`,f:t=>t-a},w:[
      {html:`${a} − ${x}`,f:t=>a-t,key:'writeOrder',why:`“${a} less than ${x}” starts with ${x} and takes ${a} away. ${a} − ${x} means “${x} less than ${a}.”`},
      {html:`${x} + ${a}`,f:t=>t+a,key:'writeOp',why:'“Less than” means subtract.'},
      {html:`${a}${x}`,f:t=>a*t,key:'writeOp',why:'“Less than” means subtract, not multiply.'}]}),
    ()=>({p:`the quotient of ${x} and ${a}`,c:{html:`${x} ÷ ${a}`,f:t=>t/a},w:[
      {html:`${a} ÷ ${x}`,f:t=>a/t,key:'writeOrder',why:`“The quotient of ${x} and ${a}” keeps the order: ${x} ÷ ${a}.`},
      {html:`${x} − ${a}`,f:t=>t-a,key:'writeOp',why:'A quotient comes from division.'},
      {html:`${a}${x}`,f:t=>a*t,key:'writeOp',why:'A quotient comes from division, not multiplication.'}]}),
    ()=>({p:`${b} times the sum of ${x} and ${a}`,c:{html:`${b}(${x} + ${a})`,f:t=>b*(t+a)},w:[
      {html:`${b}${x} + ${a}`,f:t=>b*t+a,key:'writeParens',why:`“Times the sum” multiplies the whole sum, so it needs parentheses.`},
      {html:`${b} + ${x} + ${a}`,f:t=>b+t+a,key:'writeOp',why:'“Times” means multiply.'},
      {html:`${b}(${x} − ${a})`,f:t=>b*(t-a),key:'writeOp',why:'A sum comes from addition.'}]}),
    ()=>({p:`${a} more than ${b} times ${x}`,c:{html:`${b}${x} + ${a}`,f:t=>b*t+a},w:[
      {html:`${b}(${x} + ${a})`,f:t=>b*(t+a),key:'writeParens',why:`Only ${x} is multiplied by ${b}; then ${a} is added. No parentheses needed.`},
      {html:`${a}${x} + ${b}`,f:t=>a*t+b,key:'writeSwap',why:`${b} is the number multiplying ${x}, so ${b} is the coefficient.`},
      {html:`${b}${x} − ${a}`,f:t=>b*t-a,key:'writeOp',why:'“More than” means add.'}]}),
    ()=>({p:`${x} subtracted from ${a*b}`,c:{html:`${a*b} − ${x}`,f:t=>a*b-t},w:[

      {html:`${f}${x} + ${r}`,f:t=>f*t+r,key:'writeSwap',why:`The $${r} is paid every month, so it multiplies ${x}. The $${f} is paid once.`},
      {html:`${r+f}${x}`,f:t=>(r+f)*t,key:'writeSwap',why:`The $${f} joining fee is paid only once, so it isn't multiplied by ${x}.`},
      {html:`${r} + ${f} + ${x}`,f:t=>r+f+t,key:'writeOp',why:`“Per month” means multiply: ${r} × ${x}.`}]};},

  return mkChoice({lesson:'3-4',prompt,correct:t.c,wrong:t.w,explain:`${t.story?t.p[0].toUpperCase()+t.p.slice(1):'“'+t.p+'”'} → <b>${t.c.html}</b>`});

function gParts(){

      {html:I(u),key:'parts',why:`${I(u)} is a <b>variable</b>. A constant is a number with no variable.`}]),

    ()=>{const a=ri(2,6),m=ri(2,9),k=a*m,b=ri(1,12);return {e:`${x} ÷ ${a} + ${b}`,given:`${x} = ${k}`,ans:m+b,js:`${k}/${a}+${b}`,

/* ---------------- 3-6 Distributive Property ---------------- */
function gDist(){
  const v=pick(VARS),kind=pick(['plus','minus','factor']);
  if(kind==='factor'){

    const p=[2,3].find(q=>g%q===0),h=g/p;
    return mkChoice({lesson:'3-6',prompt:`Use the GCF to factor <span class="m">${T(g*m,v)} + ${g*n}</span>.`,
      correct:{html:`${g}(${T(m,v)} + ${n})`,f:t=>g*(m*t+n)},
      wrong:[
        {html:`${p}(${T(h*m,v)} + ${h*n})`,f:t=>p*(h*m*t+h*n),equivalent:true,key:'distNotGcf',why:`That's equivalent, but ${p} isn't the <b>greatest</b> common factor: ${T(h*m,v)} and ${h*n} still share ${h}.`},
        {html:`${g}(${T(m,v)} + ${g*n})`,f:t=>g*(m*t+g*n),key:'distFactor',why:`Divide <b>both</b> terms by ${g}: ${g*n} ÷ ${g} = ${n}.`},
        {html:`${g}(${T(g*m,v)} + ${n})`,f:t=>g*(g*m*t+n),key:'distFactor',why:`Divide <b>both</b> terms by ${g}: ${g*m} ÷ ${g} = ${m}.`}],
      explain:`The GCF of ${g*m} and ${g*n} is ${g}. ${T(g*m,v)} ÷ ${g} = ${T(m,v)} and ${g*n} ÷ ${g} = ${n}, so it's <b>${g}(${T(m,v)} + ${n})</b>.`});
  }
  const a=ri(2,9),b=ri(1,6),c=ri(1,9);
  if(kind==='plus')return mkChoice({lesson:'3-6',prompt:`Use the Distributive Property to expand <span class="m">${a}(${T(b,v)} + ${c})</span>.`,
    correct:{html:`${T(a*b,v)} + ${a*c}`,f:t=>a*b*t+a*c},
    wrong:[
      {html:`${T(a*b,v)} + ${c}`,f:t=>a*b*t+c,key:'distOne',why:`Multiply ${a} by <b>every</b> term inside, including ${c}.`},
      {html:`${T(a+b,v)} + ${a+c}`,f:t=>(a+b)*t+a+c,key:'distAdd',why:`Distributing means <b>multiplying</b> each term by ${a}, not adding.`},
      {html:`${T(b,v)} + ${a*c}`,f:t=>b*t+a*c,key:'distOne',why:`Multiply ${a} by <b>every</b> term inside, including ${T(b,v)}.`}],
    explain:`${a} · ${T(b,v)} = ${T(a*b,v)} and ${a} · ${c} = ${a*c}, so it's <b>${T(a*b,v)} + ${a*c}</b>.`});
  return mkChoice({lesson:'3-6',prompt:`Use the Distributive Property to expand <span class="m">${a}(${T(b,v)} − ${c})</span>.`,

    wrong:[
      {html:`${T(a*b,v)} − ${c}`,f:t=>a*b*t-c,key:'distOne',why:`Multiply ${a} by <b>every</b> term inside, including ${c}.`},
      {html:`${T(a*b,v)} + ${a*c}`,f:t=>a*b*t+a*c,key:'distSign',why:'Keep the minus sign: the second term is subtracted.'},
      {html:`${T(b,v)} − ${a*c}`,f:t=>b*t-a*c,key:'distOne',why:`Multiply ${a} by <b>every</b> term inside, including ${T(b,v)}.`}],
    explain:`${a} · ${T(b,v)} = ${T(a*b,v)} and ${a} · ${c} = ${a*c}, keeping the minus: <b>${T(a*b,v)} − ${a*c}</b>.`});
}

/* ---------------- 3-7 Combine like terms ---------------- */
function gLike(){
  const [v,w]=shuffle(VARS),x=I(v),y=I(w),kind=pick(['four','minus','two']);
  if(kind==='four'){
    const a=ri(2,9),c=ri(2,9),b=ri(1,12),d=ri(1,12);
    return mkChoice({lesson:'3-7',prompt:`Simplify <span class="m">${T(a,v)} + ${b} + ${T(c,v)} + ${d}</span>.`,
      correct:{html:`${T(a+c,v)} + ${b+d}`,f:t=>(a+c)*t+b+d},
      wrong:[
        {html:T(a+b+c+d,v),f:t=>(a+b+c+d)*t,key:'likeUnlike',why:`${b} and ${d} have no variable, so they can't combine with the ${x}-terms.`},
        {html:`${T(a+c,v)}<sup>2</sup> + ${b+d}`,f:t=>(a+c)*t*t+b+d,key:'likeSquare',why:`Adding ${T(a,v)} and ${T(c,v)} gives ${T(a+c,v)}. The variable doesn't change.`},
        {html:`${T(a*c,v)} + ${b+d}`,f:t=>a*c*t+b+d,key:'likeMul',why:`Combine like terms by <b>adding</b> coefficients: ${a} + ${c} = ${a+c}.`}],
      explain:`${x}-terms: ${a} + ${c} = ${a+c}. Numbers: ${b} + ${d} = ${b+d}. So it's <b>${T(a+c,v)} + ${b+d}</b>.`});
  }
  if(kind==='minus'){
    const a=ri(5,12),c=ri(2,a-1),b=ri(1,15);
    return mkChoice({lesson:'3-7',prompt:`Simplify <span class="m">${T(a,v)} + ${b} − ${T(c,v)}</span>.`,
      correct:{html:`${T(a-c,v)} + ${b}`,f:t=>(a-c)*t+b},
      wrong:[
        {html:`${T(a+c,v)} + ${b}`,f:t=>(a+c)*t+b,key:'likeSign',why:`${T(c,v)} is subtracted, so ${a} − ${c} = ${a-c}.`},
        {html:T(a-c+b,v),f:t=>(a-c+b)*t,key:'likeUnlike',why:`${b} has no variable, so it stays separate from the ${x}-terms.`},
        {html:`${T(a-c,v)} − ${b}`,f:t=>(a-c)*t-b,key:'likeSign',why:`The ${b} was added, so it stays + ${b}.`}],
      explain:`${x}-terms: ${a} − ${c} = ${a-c}. The ${b} stays. So it's <b>${T(a-c,v)} + ${b}</b>.`});
  }
  const a=ri(2,9),b=ri(2,9),c=ri(2,9);
  return mkChoice({lesson:'3-7',prompt:`Simplify <span class="m">${T(a,v)} + ${T(b,w)} + ${T(c,v)}</span>.`,
    correct:{html:`${T(a+c,v)} + ${T(b,w)}`,f:(t,s)=>(a+c)*t+b*s},
    wrong:[
      {html:`${a+b+c}${x}${y}`,f:(t,s)=>(a+b+c)*t*s,key:'likeUnlike',why:`${x} and ${y} are different variables, so ${T(b,w)} can't combine with the ${x}-terms.`},
      {html:T(a+b+c,v),f:t=>(a+b+c)*t,key:'likeUnlike',why:`${T(b,w)} is a ${y}-term. Only the ${x}-terms combine.`},
      {html:`${T(a*c,v)} + ${T(b,w)}`,f:(t,s)=>a*c*t+b*s,key:'likeMul',why:`Combine like terms by <b>adding</b> coefficients: ${a} + ${c} = ${a+c}.`}],
    explain:`Only the ${x}-terms are alike: ${a} + ${c} = ${a+c}. So it's <b>${T(a+c,v)} + ${T(b,w)}</b>.`});
}

/* ---------------- Phase 2 combos (two steps each) ---------------- */
function chainTool(){
  const isLcm=Math.random()<.5;
  const p=isLcm?lcmPair():gcfPair();
  const [s,ask]=pick(isLcm?LCM_STORIES:GCF_STORIES)(p.a,p.b);
  const id=isLcm?'3-2L':'3-2G';
  const step1={lesson:id,kind:'choice',two:true,prompt:storyHTML(s,'Which tool solves this?'),
    options:[
      {html:'<b>GCF</b> · greatest common factor',correct:!isLcm,key:'pickTool',why:'Things need to line up again, so you need a common <b>multiple</b>. The answer will be bigger than both numbers.'},
      {html:'<b>LCM</b> · least common multiple',correct:isLcm,key:'pickTool',why:'You are splitting into equal groups, so you need a common <b>factor</b>. The answer will be smaller than both numbers.'}],
    explain:isLcm?`You need the first time both counts match: a common <b>multiple</b>, so use the <b>LCM</b>.`:`You are splitting both amounts into equal groups: a common <b>factor</b>, so use the <b>GCF</b>.`};
  step1.options.forEach(o=>{if(o.correct){delete o.key;delete o.why;}});
  const step2=isLcm?num(id,storyHTML(s,ask),p.L,lcmExplain(p.a,p.b),lcmDiag(p.a,p.b),{pair:[p.a,p.b],fn:'lcm'})
                   :num(id,storyHTML(s,ask),p.g,gcfExplain(p),gcfDiag(p.a,p.b),{pair:[p.a,p.b],fn:'gcf'});
  return [step1,step2];
}
function chainWrite(){
  const v=pick(VARS),x=I(v),a=ri(2,9);let b;do{b=ri(2,6);}while(b===a);const k=ri(2,9);
  const step1=mkChoice({lesson:'3-4',prompt:`Translate: “${b} times the sum of ${x} and ${a}”`,
    correct:{html:`${b}(${x} + ${a})`,f:t=>b*(t+a)},
    wrong:[
      {html:`${b}${x} + ${a}`,f:t=>b*t+a,key:'writeParens',why:'“Times the sum” multiplies the whole sum, so it needs parentheses.'},
      {html:`${b} + ${x} + ${a}`,f:t=>b+t+a,key:'writeOp',why:'“Times” means multiply.'},
      {html:`${a}(${x} + ${b})`,f:t=>a*(t+b),key:'writeSwap',why:`${b} is the number doing the multiplying, and the sum is ${x} + ${a}.`}],
    explain:`“${b} times” the whole sum (${x} + ${a}) → <b>${b}(${x} + ${a})</b>`});
  if(!step1)return null;
  const step2=num('3-5',`Evaluate <span class="m">${b}(${x} + ${a})</span> when <span class="m">${x} = ${k}</span>.`,b*(k+a),
    `${b}(${k} + ${a}) = ${b}(${k+a}) = <b>${b*(k+a)}</b>`,n=>n===b*k+a?['evalParens',`The ${b} multiplies the whole group (${k} + ${a}).`]:['eval','Substitute, add inside the parentheses, then multiply.'],{js:`${b}*(${k}+${a})`});
  return [step1,step2];
}
function chainSimplify(){
  const v=pick(VARS),x=I(v),a=ri(2,6),b=ri(1,9),c=ri(1,9),k=ri(2,6);
  const step1=mkChoice({lesson:'3-6',prompt:`Simplify <span class="m">${a}(${x} + ${b}) + ${T(c,v)}</span>.`,
    correct:{html:`${T(a+c,v)} + ${a*b}`,f:t=>(a+c)*t+a*b},
    wrong:[
      {html:`${T(a+c,v)} + ${b}`,f:t=>(a+c)*t+b,key:'distOne',why:`Distribute ${a} to <b>every</b> term: ${a} · ${b} = ${a*b}.`},
      {html:`${T(a*c,v)} + ${a*b}`,f:t=>a*c*t+a*b,key:'likeMul',why:`After distributing you have ${T(a,v)} + ${T(c,v)}. Add the coefficients: ${a} + ${c}.`},
      {html:T(a+c+a*b,v),f:t=>(a+c+a*b)*t,key:'likeUnlike',why:`${a*b} has no variable, so it stays separate from the ${x}-terms.`}],
    explain:`${a}(${x} + ${b}) = ${T(a,v)} + ${a*b}. Then ${T(a,v)} + ${T(c,v)} = ${T(a+c,v)}. So it's <b>${T(a+c,v)} + ${a*b}</b>.`});
  if(!step1)return null;
  const ans=(a+c)*k+a*b;
  const step2=num('3-5',`Now evaluate <span class="m">${T(a+c,v)} + ${a*b}</span> when <span class="m">${x} = ${k}</span>.`,ans,
    `${a+c}(${k}) + ${a*b} = ${(a+c)*k} + ${a*b} = <b>${ans}</b>`,n=>n===Number(`${a+c}${k}`)+a*b?['evalConcat',`${T(a+c,v)} means ${a+c} × ${x}.`]:['eval','Substitute, multiply, then add.'],{js:`${a+c}*${k}+${a*b}`});
  return [step1,step2];
}
function chainPower(){
  const v=pick(VARS),x=I(v),a=ri(2,4),[e,f]=shuffle([2,3]),k=ri(2,3);
  const step1=mkChoice({lesson:'3-1',prompt:`Write <span class="m">${times(a,e)} · ${times(x,f)}</span> using exponents.`,
    correct:{html:`${P(a,e)}${x}<sup>${f}</sup>`,f:t=>a**e*t**f},
    wrong:[
      {html:`${a*e}${x}<sup>${f}</sup>`,f:t=>a*e*t**f,key:'expMul',why:`${times(a,e)} is ${P(a,e)}, not ${a} × ${e}.`},
      {html:`${P(a,f)}${x}<sup>${e}</sup>`,f:t=>a**f*t**e,key:'expSwap',why:`Count each factor: ${e} factors of ${a} and ${f} factors of ${x}.`},
      {html:`${P(a,e)} · ${f}${x}`,f:t=>a**e*f*t,key:'expMul',why:`${times(x,f)} is ${x}<sup>${f}</sup>, not ${f}${x}.`}],
    explain:`${e} factors of ${a} and ${f} factors of ${x} → <b>${P(a,e)}${x}<sup>${f}</sup></b>`});
  if(!step1)return null;
  const ans=a**e*k**f;
  const step2=num('3-5',`Evaluate <span class="m">${P(a,e)}${x}<sup>${f}</sup></span> when <span class="m">${x} = ${k}</span>.`,ans,
    `${P(a,e)} · ${P(k,f)} = ${a**e} · ${k**f} = <b>${ans}</b>`,n=>n===a*e*k**f||n===a**e*f*k?['expMul','Exponents mean repeated multiplication. Work out each power first.']:['eval','Find each power first, then multiply.'],{js:`${a}**${e}*${k}**${f}`});
  return [step1,step2];
}
function chainEquiv(){
  const v=pick(VARS),x=I(v),a=ri(2,5),b=ri(2,4),c=ri(1,9),d=ri(1,a*b-1),k=ri(2,6);
  const unlike=a*c>d?{html:`${T(a*b,v)} + ${a*c-d}`,f:t=>a*b*t+a*c-d}:{html:T(a*b-d+a*c,v),f:t=>(a*b-d+a*c)*t};
  const step1=mkChoice({lesson:'3-6',prompt:`Which expression is equivalent to <span class="m">${a}(${T(b,v)} + ${c}) − ${T(d,v)}</span>?`,
    correct:{html:`${T(a*b-d,v)} + ${a*c}`,f:t=>(a*b-d)*t+a*c},
    wrong:[
      {html:`${T(a*b-d,v)} + ${c}`,f:t=>(a*b-d)*t+c,key:'distOne',why:`Distribute ${a} to <b>every</b> term: ${a} · ${c} = ${a*c}.`},
      {html:`${T(a*b+d,v)} + ${a*c}`,f:t=>(a*b+d)*t+a*c,key:'likeSign',why:`${T(d,v)} is subtracted: ${a*b} − ${d} = ${a*b-d}.`},
      {...unlike,key:'likeUnlike',why:`${T(d,v)} is an ${x}-term, so it combines with ${T(a*b,v)}, not with the number.`}],
    explain:`${a}(${T(b,v)} + ${c}) = ${T(a*b,v)} + ${a*c}. Then ${T(a*b,v)} − ${T(d,v)} = ${T(a*b-d,v)}. So it's <b>${T(a*b-d,v)} + ${a*c}</b>.`});
  if(!step1)return null;
  const ans=(a*b-d)*k+a*c;
  const step2=num('3-5',`Evaluate <span class="m">${T(a*b-d,v)} + ${a*c}</span> when <span class="m">${x} = ${k}</span>.`,ans,
    `${a*b-d}(${k}) + ${a*c} = ${(a*b-d)*k} + ${a*c} = <b>${ans}</b>`,n=>['eval','Substitute, multiply, then add.'],{js:`${a*b-d}*${k}+${a*c}`});
  return [step1,step2];
}

    S.clockTimer=setInterval(()=>{if(S.mode!=='over')$('#clock').textContent='⏱ '+clock(elapsed());},1000);
  }
  Object.assign(S,{hearts:HEARTS,phase:1,broken:{},coreHits:0,chainIds:pickChains(),chainIdx:0,step:0,steps:null,q:null,target:null,streak:0});
  syncHud();
  taunt(pick(['None shall pass! My armor is forged from every lesson in this town.','You cleared the town? My armor remembers every lesson. Do you?','Eight plates. Five hearts. Let us see what you learned, little hero.']));
  showSelect();
}
function resume(){
  if(S.pausedAt){S.qStart+=Date.now()-S.pausedAt;S.pausedAt=0;}
}

/* ---------------- Phase 1: choose a plate ---------------- */
function showSelect(){
  S.mode='select';S.q=null;S.target=null;renderPlates();
  const left=LESSONS.filter(l=>!S.broken[l.id]).length;
  $('#panel').innerHTML=`<div class="phase">PHASE 1 · ARMOR BREAK <span>· ${left} plate${left===1?'':'s'} left</span></div>
    <h2>Choose an armor plate to strike</h2>
    <p class="sub">Answer its question correctly to shatter it. Miss, and the Colossus strikes back. Save the tough ones for later if you like.</p>
    <div class="plates">${LESSONS.map((l,i)=>`<button class="pbtn ${S.broken[l.id]?'done':''}" style="--c:${l.color}" data-id="${l.id}" ${S.broken[l.id]?'disabled':''}>
      <span class="k">${S.broken[l.id]?'✓':i+1}</span><span><b>${l.code} · ${l.tag}</b><small>${l.name}</small></span></button>`).join('')}</div>`;
  $$('.pbtn').forEach(b=>b.onclick=()=>choosePlate(b.dataset.id));
}
function choosePlate(id){
  if(S.mode!=='select'||S.broken[id])return;
  SFX.pick();S.target=id;S.q=makeQ(id);askQuestion();
}

/* ---------------- Asking ---------------- */
function askQuestion(){
  S.mode='question';S.input='';S.qLimit=(S.phase===1?PLATE_TIME:CORE_TIME)*1000;S.qStart=Date.now();S.lastTick=0;
  renderPlates();
  const q=S.q,l=lessonById(q.lesson);
  const head=S.phase===1
    ?`<div class="phase">PHASE 1 · ARMOR BREAK <span>· striking plate ${l.code} ${l.tag}</span></div>`
    :`<div class="phase">PHASE 2 · CORE ASSAULT <span>· Combo ${S.chainIdx+1} of 3: ${CHAINS.find(c=>c.id===S.chainIds[S.chainIdx]).name} · Step ${S.step+1} of 2</span></div>`;
  const chip=`<span class="chip" style="--c:${l.color}">${l.code} · ${l.name.toUpperCase()}</span>`;
  let ans;
  if(q.kind==='num'){
    const keys=['7','8','9',['⌫','back','s'],'4','5','6',['CLR','clr','s'],'1','2','3','.',['0','0','zero'],['STRIKE ⚔️','go','go']];
    ans=`<div class="ansrow"><div><div class="disp" id="disp"></div><div class="hint">Type a number (like 24 or 7.5). Press Enter to strike.</div></div>
      <div class="keypad">${keys.map(k=>Array.isArray(k)?`<button class="key ${k[2]}" data-k="${k[1]}">${k[0]}</button>`:`<button class="key" data-k="${k}">${k}</button>`).join('')}</div></div>`;
  } else {
    ans=`<div class="choices ${q.two?'two':''}">${q.options.map((o,i)=>`<button class="choice ${q.two?'wide':''}" data-o="${i}"><span class="k">${i+1}</span><span class="${o.text||q.two?'':'m'}">${o.html}</span></button>`).join('')}</div>`;
  }
  $('#panel').innerHTML=`${head}<div class="card qcard">${chip}<div class="prompt">${q.prompt}</div></div>
    <div class="timer" id="timer"><div id="tbar" style="width:100%"></div></div><div id="answer">${ans}</div>`;
  if(q.kind==='num'){$$('.key').forEach(k=>k.onclick=()=>pressKey(k.dataset.k));updateDisp();}
  else $$('.choice').forEach(b=>b.onclick=()=>chooseOption(+b.dataset.o));
}
function updateDisp(){const d=$('#disp');if(d)d.innerHTML=(S.input||'')+'<span class="cur"></span>';}
function pressKey(k){
  if(S.mode!=='question'||S.q.kind!=='num')return;
  if(k==='go'){submitNum();return;}
  SFX.key();
  if(k==='back')S.input=S.input.slice(0,-1);else if(k==='clr')S.input='';else if(S.input.length<8)S.input+=k;
  $('#disp').classList.remove('err');updateDisp();
}
function submitNum(){
  if(S.mode!=='question')return;
  const n=parseNum(S.input);
  if(n===null){const d=$('#disp');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');taunt('Speak in numbers, hero!');return;}
  const q=S.q;
  if(same(n,q.answer))return onRight();
  const [key,msg]=q.diag(n);
  onWrong(key,`You answered <b>${S.input}</b>. ${msg}`);
}
function chooseOption(i){
  if(S.mode!=='question')return;
  const o=S.q.options[i];if(!o)return;
  if(o.correct)return onRight();
  onWrong(o.key||'other',`You chose <span class="m">${o.html}</span>. ${o.why||''}`);
}

/* ---------------- Outcomes ---------------- */
function tally(right,key){
  S.checks++;const st=S.stats[S.q.lesson];
  if(right){S.correct++;st.right++;}else{st.miss++;S.mistakes[key]=(S.mistakes[key]||0)+1;}
}
function correctHTML(q){
  if(q.kind==='num')return `<b>Answer:</b> <span class="m">${q.answer}</span><br>${q.explain}`;
  const c=q.options.find(o=>o.correct);
  return `<b>Answer:</b> <span class="${c.text||q.two?'':'m'}">${c.html}</span><br>${q.explain}`;
}
function onRight(){
  S.mode='feedback';tally(true);S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
  SFX.hit();flash('gold');shakeEl($('#cbody'));
  let headline;
  if(S.phase===1){
    const p=PLATES[S.target];S.broken[S.target]=true;
    const g=$(`.plate[data-id="${S.target}"]`);g.classList.remove('hit');void g.getBoundingClientRect();g.classList.add('hit');
    floater(p.lx,p.ly-14,'SHATTERED!','#ffd23f');
    headline='⚔️ Direct hit! Plate shattered.';
    taunt(pick(['My armor! A lucky strike.','You remember THAT lesson? Impossible!','Grr! Another plate gone.','Crack! ...that one was decorative.']));
  } else {
    S.coreHits++;floater(210,214,'CORE HIT!','#ffe27a');
    headline=S.step===0?'⚡ Step 1 lands! Finish the combo.':'💥 Combo complete! The Core cracks.';
    taunt(pick(['ARGH! My Core!','No! You are combining your skills!','The Core... is... weakening!']));
  }
  syncHud();
  $('#answer').innerHTML=`<div class="card fb good"><h3>${headline}</h3><div class="work">${correctHTML(S.q)}</div>
    <div class="row"><button class="btn" id="cont">CONTINUE ▶</button></div></div>`;
  $('#cont').onclick=afterRight;$('#cont').focus();
  S.autoNext=setTimeout(afterRight,S.phase===2&&S.step===0?1600:2200);
}
function afterRight(){
  clearTimeout(S.autoNext);if(S.mode!=='feedback')return;
  if(S.phase===1){
    if(LESSONS.every(l=>S.broken[l.id]))return startCore();
    return showSelect();
  }
  if(S.step===0){S.step=1;S.q=S.steps[1];return askQuestion();}
  S.chainIdx++;
  if(S.chainIdx>=S.chainIds.length)return victory();
  startChain();
}
function onWrong(key,msg,timedOut=false){
  S.mode='feedback';tally(false,key);S.streak=0;S.hearts--;
  SFX.hurt();flash();document.body.classList.remove('screen-shake');void document.body.offsetWidth;shakeEl($('#game'));
  renderHearts(S.hearts);renderPlates();
  taunt(timedOut?'Too slow, little hero!':pick(['Ha! Wrong!','Your math crumbles like old stone!','Is that all you learned?','The Colossus laughs at your answer!']));
  const next=S.hearts<=0?'FACE YOUR FATE ▶':S.phase===1?'CHOOSE A PLATE ▶':'TRY A NEW COMBO ▶';
  $('#answer').innerHTML=`<div class="card fb bad"><h3>💥 The Colossus strikes! −1 ❤️</h3><div>${msg}</div><div class="work">${correctHTML(S.q)}</div>
    <div class="row"><button class="btn red" id="cont">${next}</button></div></div>`;
  $('#cont').onclick=afterWrong;$('#cont').focus();
}
function afterWrong(){
  if(S.mode!=='feedback')return;
  if(S.hearts<=0)return defeat();
  if(S.phase===1)return showSelect();
  startChain(); // a fresh combo of the same type, from step 1
}
function timeout(){
  if(S.mode!=='question')return;
  onWrong('timeout',"⏱ <b>Time's up!</b> The Colossus charged its fist while you were thinking.",true);
}

/* ---------------- Phase 2 ---------------- */
function startCore(){
  S.mode='transition';S.phase=2;syncHud();SFX.phase();flash('gold');
  taunt('NO! My Core is exposed! You will never land a combo!');
  showModal(`<div class="kicker">PHASE 2 UNLOCKED</div><h2>🔥 The armor is shattered!</h2>
    <p>The Core is exposed. Strike it with <b>3 combo attacks</b>. Each combo has two steps that use skills from different lessons, and the second step builds on the first.</p>
    <p>Miss a step and the Colossus strikes, then sends a fresh combo of the same kind. <b>Checkpoint:</b> if you fall in Phase 2, you restart here with your armor progress saved.</p>`,
    [{label:'⚡ ATTACK THE CORE',cls:'red',primary:true,fn:startChain}]);
}
function startChain(){
  S.steps=makeChain(S.chainIds[S.chainIdx]);S.step=0;S.q=S.steps[0];askQuestion();
}

/* ---------------- Endings ---------------- */
function defeat(){
  S.mode='over';SFX.lose();S.retries++;
  const inCore=S.phase===2;
  const top=Object.entries(S.mistakes).sort((a,b)=>b[1]-a[1]).slice(0,3);
  taunt('HA HA HA! Come back when you have studied, little hero.');
  const btns=[];
  if(IN_TOWN)btns.push({label:'⬅ Return to Town',cls:'plain',fn:()=>toTown({type:'CARTRIDGE_EXIT_REQUEST'})});
  btns.push({label:inCore?'↻ RETRY PHASE 2':'↻ RETRY THE SIEGE',cls:'red',primary:true,fn:()=>{
    if(inCore){Object.assign(S,{hearts:HEARTS,coreHits:0,chainIdx:0,chainIds:pickChains(),mode:'transition'});syncHud();startChain();}
    else startRun(false);
  }});
  showModal(`<div class="kicker">DEFEATED</div><h2>💀 The Colossus stands.</h2>
    <p>${inCore?`You reached the Core and landed ${S.coreHits} of ${CORE_HITS} hits. Your armor progress is saved: retry from Phase 2 with full hearts.`
      :`You shattered ${LESSONS.filter(l=>S.broken[l.id]).length} of ${PLATE_COUNT} plates. The armor reforms, so the siege starts over with full hearts.`}</p>
    ${top.length?`<div class="review"><b>What tripped you up:</b><br>${top.map(([k,n])=>`• ${MISTAKES[k]||k} <span style="color:#6b5e88">(${n}×)</span>`).join('<br>')}</div>`:''}`,btns);
}
function victory(){
  S.mode='over';clearInterval(S.clockTimer);SFX.win();flash('gold');
  taunt('Im…possible… Expression Town… is… free…');
  $('#cbody').classList.add('collapse');
  $('#panel').innerHTML=`<div class="phase">VICTORY</div><h2>🏆 The Colossus has fallen!</h2><p class="sub">Expression Town is safe. Your Topic 3 mastery report is ready.</p>`;
  setTimeout(showReport,1600);
}
function showReport(){
  const time=elapsed(),acc=S.checks?Math.round(100*S.correct/S.checks):0;
  const rank=acc>=90&&S.retries===0?['👑','TOWN CHAMPION']:acc>=75?['🛡️','EXPRESSION KNIGHT']:acc>=55?['⚔️','SQUIRE OF EXPRESSIONS']:['🎒','BRAVE APPRENTICE'];
  const best=store.get('boss_best_acc',0),newBest=acc>best;if(newBest)store.set('boss_best_acc',acc);
  const rows=LESSONS.map(l=>{const st=S.stats[l.id],tot=st.right+st.miss;
    const status=!tot?'—':st.miss===0?'✅ Solid':st.right>=st.miss?'⚠️ Review':'🚨 Reteach';
    return `<tr><td><span class="code" style="--c:${l.color}">${l.code} ${l.tag}</span></td><td>${l.name}</td><td>${st.right} / ${tot}</td><td>${status}</td></tr>`;}).join('');
  const rev=Object.entries(S.mistakes).sort((a,b)=>b[1]-a[1]);
  const stars=Math.max(1,Math.min(3,acc>=90?3:acc>=70?2:1));
  const btns=[{label:'↻ Fight Again',cls:'plain',fn:()=>{$('#cbody').classList.remove('collapse');startRun(true);}}];
  if(IN_TOWN)btns.push({label:'SAVE & RETURN TO TOWN ▶',cls:'red',primary:true,keep:true,fn:()=>toTown({type:'CARTRIDGE_COMPLETE',payload:{
    lessonId:'G06_U03_BOSS',
    score:Math.max(1,S.correct||0), // hub stars come from score/total (answer accuracy)
    total:Math.max(1,S.checks||0),
    stars,accuracy:acc,bossDefeated:true,
  }})});
  showModal(`<div class="kicker">TOPIC 3 MASTERY REPORT · ${new Date().toLocaleDateString()}</div>
    <h2>${rank[0]} ${rank[1]}</h2>
    <div class="grid4">
      <div class="big"><b>${acc}%</b><small>Accuracy</small></div>
      <div class="big"><b>${S.hearts} ❤️</b><small>Hearts left</small></div>
      <div class="big"><b>${S.retries}</b><small>Retries</small></div>
      <div class="big"><b>${clock(time)}</b><small>Siege time</small></div>
    </div>
    <table class="mastery"><tr><th>STAGE</th><th>SKILL</th><th>CORRECT</th><th>STATUS</th></tr>${rows}</table>
    ${rev.length?`<div class="review"><b>🎯 Skills to sharpen:</b><br>${rev.slice(0,4).map(([k,n])=>`• ${MISTAKES[k]||k} <span style="color:#6b5e88">(${n}×)</span>`).join('<br>')}</div>`
      :'<div class="review ok"><b>Flawless!</b> Not a single hit landed on you.</div>'}
    ${newBest&&best?'<p><b>🏆 New best accuracy on this device!</b></p>':''}`,btns);
}

/* ---------------- Timer loop ---------------- */
setInterval(()=>{
  if(S.mode!=='question'||S.pausedAt)return;
  const left=Math.max(0,S.qLimit-(Date.now()-S.qStart)),frac=left/S.qLimit;
  const bar=$('#tbar');if(bar)bar.style.width=(frac*100)+'%';
  const tm=$('#timer');if(tm)tm.classList.toggle('low',frac<.25);
  const secs=Math.ceil(left/1000);
  if(frac<.25&&secs!==S.lastTick){S.lastTick=secs;SFX.tick();}
  if(left<=0)timeout();
},100);

/* ---------------- Input ---------------- */
document.getElementById('colossus').innerHTML=colossusSVG();
$('#colossus').addEventListener('click',e=>{const g=e.target.closest('.plate');if(g)choosePlate(g.dataset.id);});
$('#colossus').addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('.plate');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();choosePlate(g.dataset.id);}});
$('#mute').onclick=()=>{S.muted=!S.muted;store.set('boss_muted',S.muted);$('#mute').textContent=S.muted?'🔇':'🔊';};
$('#mute').textContent=S.muted?'🔇':'🔊';
$('#help').onclick=()=>{if(S.mode==='brief'||S.mode==='over'||!$('#modal').classList.contains('hidden'))return;if(S.mode==='question')S.pausedAt=Date.now();showBriefing(false);};
document.addEventListener('keydown',e=>{
  if(!$('#modal').classList.contains('hidden')){
    if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){const i=modalBtns.findIndex(b=>b.primary);const b=modalBtns[i>=0?i:modalBtns.length-1];if(b){e.preventDefault();if(!b.keep)hideModal();b.fn();}}
    return;
  }
  const k=e.key;
  if(S.mode==='select'){const i=parseInt(k,10);if(i>=1&&i<=LESSONS.length){const l=LESSONS[i-1];if(!S.broken[l.id])choosePlate(l.id);}return;}
  if(S.mode==='feedback'){if(k==='Enter'&&document.activeElement?.id!=='cont'){e.preventDefault();$('#cont')?.click();}return;}
  if(S.mode!=='question')return;
  if(S.q.kind==='choice'){const i=parseInt(k,10);if(i>=1&&i<=S.q.options.length)chooseOption(i-1);return;}
  if(/^[0-9.]$/.test(k))pressKey(k);
  else if(k==='Backspace'){e.preventDefault();pressKey('back');}
  else if(k==='Escape')pressKey('clr');
  else if(k==='Enter'){e.preventDefault();submitNum();}
});

/* ---------------- Boot ---------------- */
S.hearts=HEARTS;S.broken={};S.coreHits=0;S.phase=1;
syncHud();
taunt('Who dares approach the Boss Castle?');
$('#panel').innerHTML=`<div class="phase">TOPIC 3 CAPSTONE</div><h2>The Expression Colossus awaits.</h2><p class="sub">Read the mission briefing, then begin the siege.</p>`;
showBriefing(true);

// Expression Town handshake: announce readiness, then follow the hub's mute setting
if(IN_TOWN)toTown({type:'CARTRIDGE_READY'});
window.addEventListener('message',ev=>{
  const d=ev.data;if(!d||typeof d!=='object'||d.type!=='HUB_INIT')return;
  const p=d.payload||{};
  if(typeof p.isMuted==='boolean'){S.muted=p.isMuted;$('#mute').textContent=S.muted?'🔇':'🔊';}
});
}
</script>
</body>
</html>
